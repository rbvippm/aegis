<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Aegis social image source</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #14213d;
      }
      .artboard {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 90% 10%, #fff 0%, transparent 58%),
          linear-gradient(135deg, #f5f8ff 5%, #e7f2ff 62%, #d5eaff);
      }
      .landscape {
        position: absolute;
        right: -70px;
        bottom: -26px;
        width: 900px;
        opacity: 0.15;
        mask-image: linear-gradient(90deg, transparent, #000 70%);
      }
      .orbit {
        position: absolute;
        width: 690px;
        height: 690px;
        right: -146px;
        top: -46px;
        border: 1px solid #ffffffd9;
        border-radius: 50%;
        box-shadow:
          0 0 0 46px #ffffff26,
          0 0 0 47px #ffffff66,
          0 0 0 112px #ffffff26;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 52px;
        margin: 0;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -1.5px;
        line-height: 1.2;
      }
      .headline {
        position: absolute;
        left: 72px;
        top: 176px;
        margin: 0;
        font-size: 68px;
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1.36;
      }
      .headline span {
        display: block;
        color: #0864ff;
      }
      .description {
        position: absolute;
        left: 76px;
        top: 389px;
        margin: 0;
        font-size: 26px;
        font-weight: 400;
        line-height: 1.5;
        color: #526581;
        letter-spacing: 0.5px;
      }
      .signature {
        position: absolute;
        left: 76px;
        bottom: 58px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #3d5d86;
        font-size: 23px;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .signature::before {
        content: '';
        width: 24px;
        height: 2px;
        background: #0864ff;
        border-radius: 2px;
      }
      .emblem {
        position: absolute;
        top: 128px;
        right: 72px;
        width: 306px;
        height: 350px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        border-radius: 52px;
        border: 1px solid #d7e6f8;
        background: linear-gradient(145deg, #ffffffed, #ffffff9c);
        box-shadow:
          inset 0 0 0 2px #ffffffc9,
          0 22px 54px -24px #3d5d8638;
      }
      .emblem img {
        width: 226px;
        height: 226px;
        object-fit: contain;
      }
      .emblem p {
        margin: 0;
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 1px;
        color: #3d5d86;
      }
      /* A separate square composition avoids squeezing the wide artwork into tiny tiles. */
      .square {
        width: 600px;
        height: 600px;
      }
      .square .orbit {
        width: 550px;
        height: 550px;
        top: -160px;
        right: -230px;
      }
      .square .landscape {
        width: 850px;
        right: -180px;
        bottom: -10px;
        opacity: 0.12;
      }
      .square .brand {
        top: 274px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 49px;
      }
      .square .emblem {
        top: 62px;
        left: 204px;
        width: 192px;
        height: 192px;
        border-radius: 44px;
      }
      .square .emblem img {
        width: 164px;
        height: 164px;
      }
      .square .emblem p {
        display: none;
      }
      .square .headline {
        top: 366px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 39px;
        line-height: 1.5;
        letter-spacing: -0.8px;
      }
      .square .description {
        display: none;
      }
      .square .signature {
        left: 0;
        bottom: 40px;
        width: 100%;
        justify-content: center;
        font-size: 20px;
      }
      .square .signature::before {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="artboard">
      <img class="landscape" src="__GLACIER__" alt="" />
      <div class="orbit"></div>
      <p class="brand">Aegis</p>
      <h1 class="headline">更清晰的数据<span>更理性的选择</span></h1>
      <p class="description">链上资金监测 · 体育数据对比 · AI 解读</p>
      <div class="emblem">
        <img src="__MARK__" alt="Aegis" />
        <p>看清平台 · 理解依据</p>
      </div>
      <div class="signature">aegisuu.vercel.app</div>
    </main>
  </body>
</html>
